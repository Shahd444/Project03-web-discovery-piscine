<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <!-- defer:execute the script after the html is parsed -->
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Tasks</h1>
    <input type="text" id="taskInput" placeholder="Enter a task" required>
    <button id="addTask" class="button">Add Task</button>
    <ul id="taskList"></ul>
    <h2 id="taskCount">0</h2>
</body>
</html>
